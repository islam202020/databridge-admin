<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز عمليات داتا بريدج | Data Bridge Ops Pro v4</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; scroll-behavior: smooth; }
        .glass-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); }
        .stat-card { transition: all 0.3s ease; border-radius: 40px; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        @keyframes pulse-gold { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pulse-pending { animation: pulse-gold 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyCic2l0BP5h6sEiPxPkVO7A6RaIVr77BIA",
            authDomain: "data-bridge-dd630.firebaseapp.com",
            projectId: "data-bridge-dd630",
            storageBucket: "data-bridge-dd630.firebasestorage.app",
            messagingSenderId: "314199405184",
            appId: "1:314199405184:web:8a7bb62163c5e0e7eaec65"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "data-bridge";

        function App() {
            const [dbUser, setDbUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [step, setStep] = useState('auth-email'); 
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            
            const [allUsers, setAllUsers] = useState([]);
            const [services, setServices] = useState([]);
            const [withdrawals, setWithdrawals] = useState([]);
            
            const [selectedMarketer, setSelectedMarketer] = useState(null);
            const [selectedReferral, setSelectedReferral] = useState(null);
            const [showServiceModal, setShowServiceModal] = useState(false);
            const [showWithdrawModal, setShowWithdrawModal] = useState(false);
            
            const [editingServiceId, setEditingServiceId] = useState(null);
            const [serviceForm, setServiceForm] = useState({ name: '', price: '', status: 'جارية' });
            const [withdrawForm, setWithdrawForm] = useState({ amount: '', number: '', method: 'Vodafone Cash' });

            useEffect(() => {
                const init = async () => {
                    try {
                        await auth.signInAnonymously();
                        const saved = localStorage.getItem('db_ops_session_v4');
                        if (saved) {
                            const parsed = JSON.parse(saved);
                            setDbUser(parsed);
                            setStep('dashboard');
                        }
                        setLoading(false);
                    } catch (e) { setError("خطأ في اتصال السيرفر."); setLoading(false); }
                };
                init();
            }, []);

            useEffect(() => {
                if (step === 'dashboard' && dbUser) {
                    const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                    
                    const unsubUsers = baseRef.collection('users').onSnapshot(snap => setAllUsers(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                    const unsubServices = baseRef.collection('services').onSnapshot(snap => setServices(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                    const unsubWithdraw = baseRef.collection('withdrawals').onSnapshot(snap => setWithdrawals(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                    
                    const unsubMe = baseRef.collection('users').doc(dbUser.uid || dbUser.id).onSnapshot(doc => {
                        if(doc.exists) {
                            const data = { ...doc.data(), uid: doc.id };
                            setDbUser(data);
                            localStorage.setItem('db_ops_session_v4', JSON.stringify(data));
                        }
                    });

                    return () => { unsubUsers(); unsubServices(); unsubWithdraw(); unsubMe(); };
                }
            }, [step]);

            // --- Handlers ---
            const checkEmail = async () => {
                setError(''); setLoading(true);
                try {
                    const snap = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').where('email', '==', email.trim().toLowerCase()).get();
                    if (snap.empty) setError('هذا البريد غير مسجل.');
                    else {
                        const doc = snap.docs[0];
                        const data = doc.data();
                        setDbUser({ ...data, uid: doc.id });
                        setStep(data.dashboardPassword ? 'auth-password' : 'setup-password');
                    }
                } catch (e) { setError('فشل جلب البيانات.'); }
                setLoading(false);
            };

            const handlePasswordLogin = () => {
                if (password === dbUser.dashboardPassword) {
                    localStorage.setItem('db_ops_session_v4', JSON.stringify(dbUser));
                    setStep('dashboard');
                } else setError('كلمة المرور غير صحيحة.');
            };

            const handleLogout = () => {
                if(confirm("هل تريد تسجيل الخروج من غرفة العمليات؟")) {
                    localStorage.removeItem('db_ops_session_v4');
                    window.location.reload();
                }
            };

            // --- Service Operations ---
            const handleAddOrEditService = async () => {
                const serviceData = { 
                    ...serviceForm, 
                    price: parseFloat(serviceForm.price),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                };

                const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');

                try {
                    if (editingServiceId) {
                        // تعديل
                        await baseRef.collection('services').doc(editingServiceId).update(serviceData);
                    } else {
                        // إضافة جديد
                        const newService = {
                            ...serviceData,
                            userId: selectedReferral.uid || selectedReferral.id,
                            userName: selectedReferral.name,
                            marketerId: selectedMarketer.uid || selectedMarketer.id
                        };
                        await baseRef.collection('services').add(newService);
                        
                        // إضافة عمولة إذا انتهى
                        if (serviceForm.status === 'تم التنفيذ') {
                            const commission = parseFloat(serviceForm.price) * 0.1;
                            await baseRef.collection('users').doc(selectedMarketer.uid || selectedMarketer.id).update({ 
                                commissionBalance: firebase.firestore.FieldValue.increment(commission) 
                            });
                        }
                    }
                    setShowServiceModal(false);
                    setEditingServiceId(null);
                    setServiceForm({ name: '', price: '', status: 'جارية' });
                } catch (e) { alert("حدث خطأ: " + e.message); }
            };

            const deleteService = async (id) => {
                if(!confirm("هل أنت متأكد من حذف هذه العملية نهائياً؟")) return;
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('services').doc(id).delete();
            };

            const startEditService = (service) => {
                setServiceForm({ name: service.name, price: service.price, status: service.status });
                setEditingServiceId(service.id);
                setSelectedReferral({ name: service.userName }); // للعرض فقط
                setShowServiceModal(true);
            };

            // --- Financial ---
            const approveWithdrawal = async (request) => {
                if(!confirm(`تأكيد تحويل ${request.amount}ج؟ سيتم الخصم فوراً.`)) return;
                const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                await baseRef.collection('users').doc(request.marketerId).update({
                    commissionBalance: firebase.firestore.FieldValue.increment(-parseFloat(request.amount))
                });
                await baseRef.collection('withdrawals').doc(request.id).update({ status: 'تم الدفع', executedAt: firebase.firestore.FieldValue.serverTimestamp() });
            };

            const submitWithdrawRequest = async () => {
                const amount = parseFloat(withdrawForm.amount);
                if (amount > (dbUser.commissionBalance || 0)) return alert("رصيدك غير كافٍ!");
                const req = { ...withdrawForm, amount, marketerId: dbUser.uid, marketerName: dbUser.name, status: 'معلق', timestamp: firebase.firestore.FieldValue.serverTimestamp() };
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('withdrawals').add(req);
                setShowWithdrawModal(false);
            };

            // --- Stats ---
            const stats = useMemo(() => {
                const finished = services.filter(s => s.status === 'تم التنفيذ');
                return {
                    totalSales: finished.reduce((acc, curr) => acc + (curr.price || 0), 0),
                    pendingSettle: withdrawals.filter(w => w.status === 'معلق').length,
                    usersCount: allUsers.length,
                    marketersCount: allUsers.filter(u => u.role === 'marketer').length
                };
            }, [services, withdrawals, allUsers]);

            const isAdmin = dbUser?.role?.toLowerCase() === 'admin';

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-emerald-400 font-bold">LOADING OPS HUB...</div>;

            if (step !== 'dashboard') return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6">
                    <div className="bg-white p-10 rounded-[50px] shadow-2xl w-full max-w-md text-center">
                        <div className="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-3xl flex items-center justify-center mx-auto mb-6"><i className="fas fa-shield-alt text-3xl"></i></div>
                        <h1 className="text-2xl font-black text-slate-900 mb-8">Data Bridge <span className="text-emerald-500">Ops</span></h1>
                        {error && <div className="bg-red-50 text-red-600 p-4 rounded-2xl mb-6 text-sm font-bold">{error}</div>}
                        <div className="space-y-4">
                            <input 
                                type={step === 'auth-email' ? "email" : "password"} 
                                className="w-full p-5 rounded-3xl bg-slate-50 border-2 border-transparent focus:border-emerald-500 outline-none text-center font-bold transition-all" 
                                placeholder={step === 'auth-email' ? "البريد الإلكتروني" : "كلمة المرور"}
                                value={step === 'auth-email' ? email : password} 
                                onChange={(e) => step === 'auth-email' ? setEmail(e.target.value) : setPassword(e.target.value)}
                            />
                            <button 
                                onClick={step === 'auth-email' ? checkEmail : handlePasswordLogin} 
                                className="w-full py-5 bg-slate-900 text-white rounded-3xl font-black text-lg active:scale-95 transition-all shadow-lg"
                            >
                                {step === 'auth-email' ? "التحقق من الصلاحية" : "دخول النظام"}
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-20">
                    <nav className="glass-nav text-white p-5 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="bg-emerald-500 p-2 rounded-xl shadow-lg shadow-emerald-500/20"><i className="fas fa-terminal"></i></div>
                                <span className="font-black text-xl italic tracking-tighter uppercase">DATA BRIDGE <span className="text-emerald-400">COMMAND</span></span>
                            </div>
                            <div className="flex items-center gap-3">
                                <span className="hidden md:block text-[10px] font-bold opacity-50 uppercase tracking-widest">{dbUser.name} | {dbUser.role}</span>
                                <button onClick={handleLogout} className="bg-red-500/10 text-red-500 w-10 h-10 rounded-xl hover:bg-red-500 hover:text-white transition-all"><i className="fas fa-sign-out-alt"></i></button>
                            </div>
                        </div>
                    </nav>

                    <div className="max-w-7xl mx-auto p-4 md:p-8">
                        {/* Stats Row */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                            {[
                                { label: 'إجمالي المبيعات', val: stats.totalSales + ' ج', icon: 'fa-chart-pie', color: 'text-slate-800' },
                                { label: 'دليل المستخدمين', val: stats.usersCount, icon: 'fa-users', color: 'text-blue-600' },
                                { label: 'طاقم التسويق', val: stats.marketersCount, icon: 'fa-user-tie', color: 'text-emerald-600' },
                                { label: 'طلبات معلقة', val: stats.pendingSettle, icon: 'fa-clock', color: stats.pendingSettle > 0 ? 'text-amber-500 pulse-pending' : 'text-slate-300' },
                            ].map((s, i) => (
                                <div key={i} className="stat-card bg-white p-6 shadow-sm border border-slate-100 relative overflow-hidden">
                                    <p className="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">{s.label}</p>
                                    <h3 className={`text-2xl font-black ${s.color}`}>{s.val}</h3>
                                    <i className={`fas ${s.icon} absolute -right-2 -bottom-2 text-5xl opacity-5`}></i>
                                </div>
                            ))}
                        </div>

                        {isAdmin ? (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                {/* الدليل الشامل لجميع المستخدمين */}
                                <div className="lg:col-span-8 space-y-8">
                                    <div className="bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden">
                                        <div className="p-8 border-b bg-slate-50/50 flex justify-between items-center">
                                            <h2 className="font-black text-xl italic uppercase tracking-tighter">System Master Directory</h2>
                                            <span className="text-[10px] bg-slate-900 text-white px-3 py-1 rounded-full font-bold">ALL USERS</span>
                                        </div>
                                        <div className="divide-y divide-slate-50 max-h-[600px] overflow-y-auto custom-scroll">
                                            {allUsers.map(u => (
                                                <div key={u.id} className="p-6 hover:bg-slate-50 transition-all flex flex-wrap justify-between items-center gap-4">
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-12 h-12 rounded-2xl flex items-center justify-center font-black text-white ${u.role === 'admin' ? 'bg-slate-900' : u.role === 'marketer' ? 'bg-emerald-500 shadow-lg shadow-emerald-500/20' : 'bg-blue-500'}`}>
                                                            {u.name?.charAt(0)}
                                                        </div>
                                                        <div>
                                                            <h4 className="font-black text-slate-800">{u.name}</h4>
                                                            <p className="text-[10px] font-bold text-slate-400">{u.phone} | {u.email}</p>
                                                            {u.role === 'marketer' && (
                                                                <p className="text-[9px] text-emerald-600 font-black mt-1 bg-emerald-50 inline-block px-2 py-0.5 rounded-md uppercase tracking-tighter border border-emerald-100">
                                                                    Pass: {u.dashboardPassword || 'لم يحدد'}
                                                                </p>
                                                            )}
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        {u.role === 'marketer' ? (
                                                            <button onClick={() => setSelectedMarketer(u)} className="bg-slate-100 text-slate-600 px-4 py-2 rounded-xl font-black text-[10px] hover:bg-emerald-500 hover:text-white transition-all">إدارة الشبكة</button>
                                                        ) : (
                                                            <span className="text-[10px] text-slate-300 font-black italic uppercase">Regular User</span>
                                                        )}
                                                        <button onClick={() => window.open(`https://wa.me/2${u.phone}`, '_blank')} className="text-emerald-500 p-2"><i className="fab fa-whatsapp text-xl"></i></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* إدارة شبكة المسوق المختار */}
                                    {selectedMarketer && (
                                        <div className="bg-emerald-50 rounded-[40px] p-8 border-2 border-emerald-100 animate-in slide-in-from-bottom-5 duration-500">
                                            <div className="flex justify-between items-center mb-6">
                                                <h3 className="font-black text-emerald-800 italic uppercase tracking-tighter">Referrals Network: {selectedMarketer.name}</h3>
                                                <button onClick={() => setSelectedMarketer(null)} className="text-emerald-800/40 hover:text-red-500"><i className="fas fa-times-circle text-2xl"></i></button>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {allUsers.filter(u => u.referredBy === selectedMarketer.id || u.referredBy === selectedMarketer.uid).map(ref => (
                                                    <div key={ref.id} className="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center">
                                                        <div>
                                                            <p className="font-black text-slate-800">{ref.name}</p>
                                                            <p className="text-[10px] font-bold text-slate-400 italic">ID: {ref.id.substring(0,8)}</p>
                                                        </div>
                                                        <button onClick={() => { setSelectedReferral(ref); setEditingServiceId(null); setServiceForm({name:'', price:'', status:'جارية'}); setShowServiceModal(true); }} className="w-10 h-10 bg-emerald-500 text-white rounded-xl shadow-lg active:scale-90 transition-all"><i className="fas fa-plus"></i></button>
                                                    </div>
                                                ))}
                                                {allUsers.filter(u => u.referredBy === selectedMarketer.id || u.referredBy === selectedMarketer.uid).length === 0 && <p className="col-span-2 text-center text-emerald-800/30 py-10 font-black italic">لا يوجد إحالات مسجلة لهذا المسوق.</p>}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* السجل الجانبي مع إمكانية التعديل والحذف */}
                                <div className="lg:col-span-4">
                                    <div className="bg-slate-900 rounded-[40px] p-8 text-white min-h-[600px] shadow-2xl sticky top-28 border border-white/5">
                                        <h3 className="font-black text-lg mb-8 pb-4 border-b border-white/10 flex justify-between items-center">
                                            <span>Operations Log</span>
                                            <i className="fas fa-circle text-[8px] text-emerald-500 animate-pulse"></i>
                                        </h3>
                                        <div className="space-y-6 max-h-[700px] overflow-y-auto custom-scroll pr-2">
                                            {services.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)).map(s => (
                                                <div key={s.id} className="group relative pr-5 border-r border-white/10 hover:border-emerald-500 transition-all">
                                                    <div className={`absolute -right-[4.5px] top-0 w-2 h-2 rounded-full ${s.status === 'تم التنفيذ' ? 'bg-emerald-500 shadow-[0_0_10px_#10b981]' : 'bg-amber-500'}`}></div>
                                                    <div className="flex justify-between items-start">
                                                        <div>
                                                            <p className="text-[10px] font-black text-white/90 uppercase tracking-tighter">{s.userName}</p>
                                                            <p className="text-[11px] font-bold text-emerald-400 mt-1">{s.name} | {s.price}ج</p>
                                                            <p className="text-[8px] text-white/30 font-bold italic mt-2">{s.timestamp ? new Date(s.timestamp.seconds * 1000).toLocaleString('ar-EG') : 'جارٍ الحفظ...'}</p>
                                                        </div>
                                                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-all">
                                                            <button onClick={() => startEditService(s)} className="w-7 h-7 bg-white/5 hover:bg-white/20 rounded-lg flex items-center justify-center text-[10px] text-blue-400"><i className="fas fa-pen"></i></button>
                                                            <button onClick={() => deleteService(s.id)} className="w-7 h-7 bg-white/5 hover:bg-red-500 rounded-lg flex items-center justify-center text-[10px] text-red-400 hover:text-white"><i className="fas fa-trash"></i></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* لوحة المسوق */
                            <div className="space-y-8">
                                <div className="bg-emerald-600 p-12 rounded-[55px] text-white shadow-2xl relative overflow-hidden">
                                    <div className="absolute right-0 top-0 w-64 h-64 bg-white/10 rounded-full translate-x-1/2 -translate-y-1/2"></div>
                                    <p className="text-[10px] font-black uppercase tracking-[0.2em] opacity-60 mb-2">My Available Balance</p>
                                    <h2 className="text-6xl font-black mb-8 italic">{(dbUser.commissionBalance || 0).toFixed(0)} <span className="text-xl opacity-40 italic">EGP</span></h2>
                                    <button onClick={() => setShowWithdrawModal(true)} className="bg-white text-emerald-600 px-10 py-4 rounded-2xl font-black text-sm shadow-xl active:scale-95 transition-all">سحب الأرباح 💸</button>
                                </div>
                                <div className="bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-8 border-b bg-slate-50 flex justify-between items-center">
                                        <h3 className="font-black text-xl italic uppercase tracking-tighter">My Network Activity</h3>
                                        <button className="bg-slate-900 text-white px-6 py-2 rounded-xl font-black text-[10px]" onClick={() => {
                                            const link = `${window.location.origin}/?ref=${dbUser.uid || dbUser.id}`;
                                            navigator.clipboard.writeText(link);
                                            alert("تم نسخ رابطك!");
                                        }}>رابط الإحالة الخاص بي</button>
                                    </div>
                                    <div className="p-8 space-y-4">
                                        {allUsers.filter(u => u.referredBy === dbUser.uid || u.referredBy === dbUser.id).map(u => (
                                            <div key={u.id} className="bg-slate-50 p-6 rounded-3xl flex justify-between items-center">
                                                <div>
                                                    <p className="font-black text-slate-800">{u.name}</p>
                                                    <div className="flex gap-2 mt-2">
                                                        {services.filter(s => s.userId === u.id || s.userId === u.uid).map(s => (
                                                            <span key={s.id} className={`text-[9px] font-black px-2 py-1 rounded-md border ${s.status === 'تم التنفيذ' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-white text-slate-400 border-slate-200'}`}>{s.name}</span>
                                                        ))}
                                                    </div>
                                                </div>
                                                <i className="fas fa-chevron-left text-slate-200"></i>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Service Modal */}
                    {showServiceModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex items-center justify-center p-6 text-right">
                            <div className="bg-white rounded-[45px] p-10 w-full max-w-lg shadow-2xl">
                                <h3 className="text-2xl font-black mb-1 text-slate-900 uppercase italic tracking-tighter">
                                    {editingServiceId ? 'Edit Operation' : 'Commit New Operation'}
                                </h3>
                                <p className="text-slate-400 font-bold mb-8 text-xs italic">Client: {selectedReferral?.name}</p>
                                <div className="space-y-5">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase pr-2">Service Identity</label>
                                        <input className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold border-2 border-transparent focus:border-emerald-500 transition-all" placeholder="مثال: متجر الكتروني متكامل" value={serviceForm.name} onChange={e => setServiceForm({...serviceForm, name: e.target.value})}/>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase pr-2">Contract Value (EGP)</label>
                                        <input className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold text-center text-2xl text-emerald-600 border-2 border-transparent focus:border-emerald-500 transition-all" type="number" placeholder="0.00" value={serviceForm.price} onChange={e => setServiceForm({...serviceForm, price: e.target.value})}/>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase pr-2">Operation Status</label>
                                        <select className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold border-2 border-transparent focus:border-emerald-500 transition-all" value={serviceForm.status} onChange={e => setServiceForm({...serviceForm, status: e.target.value})}>
                                            <option>جارية</option><option>تم التنفيذ</option><option>تم الرفض</option>
                                        </select>
                                    </div>
                                    <div className="flex gap-4 pt-6">
                                        <button onClick={handleAddOrEditService} className="flex-1 py-5 bg-slate-900 text-white rounded-3xl font-black text-lg shadow-xl active:scale-95 transition-all">
                                            {editingServiceId ? 'تحديث البيانات' : 'تأكيد العملية'}
                                        </button>
                                        <button onClick={() => { setShowServiceModal(false); setEditingServiceId(null); }} className="px-8 py-5 bg-slate-100 text-slate-400 rounded-3xl font-black">إلغاء</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Withdraw Modal */}
                    {showWithdrawModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex items-center justify-center p-6 text-right">
                            <div className="bg-white rounded-[45px] p-10 w-full max-w-lg shadow-2xl">
                                <h3 className="text-2xl font-black mb-6 text-slate-900 italic tracking-tighter">REQUEST WITHDRAWAL</h3>
                                <div className="space-y-5">
                                    <input className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-black text-center text-3xl text-emerald-600" type="number" placeholder="المبلغ" value={withdrawForm.amount} onChange={e => setWithdrawForm({...withdrawForm, amount: e.target.value})}/>
                                    <input className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold text-center tracking-widest" placeholder="رقم المحفظة" value={withdrawForm.number} onChange={e => setWithdrawForm({...withdrawForm, number: e.target.value})}/>
                                    <select className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold text-center" value={withdrawForm.method} onChange={e => setWithdrawForm({...withdrawForm, method: e.target.value})}>
                                        <option value="Vodafone Cash">Vodafone Cash</option>
                                        <option value="InstaPay">InstaPay</option>
                                        <option value="Binance Pay">Binance Pay (USDT)</option>
                                    </select>
                                    <button onClick={submitWithdrawRequest} className="w-full py-5 bg-emerald-500 text-white rounded-3xl font-black text-lg shadow-xl active:scale-95 transition-all mt-6">إرسال الطلب للمراجعة</button>
                                    <button onClick={() => setShowWithdrawModal(false)} className="w-full py-3 text-slate-300 font-bold uppercase text-[10px] tracking-widest">Close Portal</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
