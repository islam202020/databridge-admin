<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز عمليات داتا بريدج | Data Bridge Ops</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Scripts: React, Babel, Tailwind, Lucide -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDKs (Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #2ecc71; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Firebase Config (نفس بياناتك) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCic2l0BP5h6sEiPxPkVO7A6RaIVr77BIA",
            authDomain: "data-bridge-dd630.firebaseapp.com",
            projectId: "data-bridge-dd630",
            storageBucket: "data-bridge-dd630.firebasestorage.app",
            messagingSenderId: "314199405184",
            appId: "1:314199405184:web:8a7bb62163c5e0e7eaec65",
            measurementId: "G-QYKYHC88WS"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "data-bridge";

        function App() {
            const [user, setUser] = useState(null);
            const [dbUser, setDbUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [step, setStep] = useState('auth-email'); 
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            
            // Data States
            const [allUsers, setAllUsers] = useState([]);
            const [services, setServices] = useState([]);
            const [withdrawals, setWithdrawals] = useState([]);
            const [selectedMarketer, setSelectedMarketer] = useState(null);
            const [selectedReferral, setSelectedReferral] = useState(null);
            const [showServiceModal, setShowServiceModal] = useState(false);
            const [showWithdrawModal, setShowWithdrawModal] = useState(false);

            // Forms
            const [serviceForm, setServiceForm] = useState({ name: '', price: '', status: 'جارية' });
            const [withdrawForm, setWithdrawForm] = useState({ amount: '', number: '', method: 'Vodafone Cash' });

            useEffect(() => {
                const unsub = auth.onAuthStateChanged((u) => {
                    // نحن نستخدم نظام تسجيل دخول "داخلي" عبر Firestore، وليس Auth التقليدي فقط
                    setLoading(false);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (step === 'dashboard' && dbUser) {
                    const qUsers = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users');
                    const unsubUsers = qUsers.onSnapshot((snap) => {
                        setAllUsers(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                    const qServices = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('services');
                    const unsubServices = qServices.onSnapshot((snap) => {
                        setServices(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                    const qWithdraw = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('withdrawals');
                    const unsubWithdraw = qWithdraw.onSnapshot((snap) => {
                        setWithdrawals(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                    return () => { unsubUsers(); unsubServices(); unsubWithdraw(); };
                }
            }, [step, dbUser]);

            // --- Logic Functions ---
            const checkEmail = async () => {
                setError('');
                setLoading(true);
                try {
                    const snap = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').where('email', '==', email.trim()).get();
                    
                    if (snap.empty) {
                        setError('هذا الإيميل غير مسجل. يرجى التواصل مع الإدارة: 01100665674');
                        setLoading(false);
                        return;
                    }

                    const data = snap.docs[0].data();
                    if (data.role !== 'admin' && data.role !== 'marketer') {
                        setError('عذراً، هذا الحساب ليس له صلاحية دخول الداشبورد. تواصل مع الإدارة: 01100665674');
                        setLoading(false);
                        return;
                    }
                    
                    setDbUser(data);
                    setStep(data.dashboardPassword ? 'auth-password' : 'setup-password');
                } catch (e) {
                    setError('خطأ في الاتصال بقاعدة البيانات.');
                }
                setLoading(false);
            };

            const handlePasswordLogin = () => {
                if (password === dbUser.dashboardPassword) {
                    setStep('dashboard');
                } else {
                    setError('كلمة المرور غير صحيحة.');
                }
            };

            const handleSetupPassword = async () => {
                if (password.length < 6) {
                    setError('يجب أن تكون كلمة المرور 6 أحرف على الأقل.');
                    return;
                }
                setLoading(true);
                const userRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(dbUser.uid);
                await userRef.update({ dashboardPassword: password });
                setStep('dashboard');
                setLoading(false);
            };

            const forgotPassword = () => {
                alert(`كلمة مرورك الحالية هي: ${dbUser.dashboardPassword}\nتم عرضها هنا للأمان بناءً على طلب الإدارة.`);
            };

            const addService = async () => {
                const serviceData = {
                    ...serviceForm,
                    userId: selectedReferral.uid,
                    userName: selectedReferral.name,
                    marketerId: selectedMarketer.uid,
                    price: parseFloat(serviceForm.price),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('services').add(serviceData);
                
                if (serviceForm.status === 'تم التنفيذ') {
                    const commission = parseFloat(serviceForm.price) * 0.1;
                    const marketerRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(selectedMarketer.uid);
                    await marketerRef.update({ 
                        commissionBalance: firebase.firestore.FieldValue.increment(commission)
                    });
                }
                setShowServiceModal(false);
                setServiceForm({ name: '', price: '', status: 'جارية' });
            };

            const submitWithdraw = async () => {
                if (parseFloat(withdrawForm.amount) > (dbUser.commissionBalance || 0)) {
                    alert('الرصيد غير كافٍ.');
                    return;
                }
                const req = {
                    ...withdrawForm,
                    marketerId: dbUser.uid,
                    marketerName: dbUser.name,
                    status: 'معلق',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('withdrawals').add(req);
                alert('تم إرسال طلب السحب للإدارة.');
                setShowWithdrawModal(false);
            };

            // --- UI Renders ---
            if (loading) return (
                <div className="min-h-screen flex items-center justify-center bg-white">
                    <div className="animate-spin-custom rounded-full h-12 w-12 border-t-4 border-emerald-500"></div>
                </div>
            );

            if (step !== 'dashboard') return (
                <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
                    <div className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-md border border-slate-100 text-center">
                        <div className="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-3xl flex items-center justify-center mx-auto mb-6">
                            <i className="fas fa-lock text-3xl"></i>
                        </div>
                        <h1 className="text-2xl font-black text-slate-800">مركز إدارة داتا بريدج</h1>
                        <p className="text-slate-400 mt-2 mb-8 font-bold">نظام المسوقين والعمليات</p>

                        {error && <div className="bg-red-50 text-red-600 p-4 rounded-2xl text-sm mb-6 font-bold leading-relaxed">{error}</div>}

                        {step === 'auth-email' && (
                            <div className="space-y-5">
                                <div className="text-right">
                                    <label className="block text-xs font-black text-slate-400 mb-2 px-2">البريد الإلكتروني</label>
                                    <input type="email" className="w-full p-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-emerald-500 outline-none transition-all text-center font-bold" placeholder="example@mail.com" value={email} onChange={(e) => setEmail(e.target.value)}/>
                                </div>
                                <button onClick={checkEmail} className="w-full py-4 bg-emerald-500 text-white rounded-2xl font-black text-lg hover:bg-emerald-600 transition-all shadow-lg shadow-emerald-200">متابعة</button>
                            </div>
                        )}

                        {step === 'auth-password' && (
                            <div className="space-y-5">
                                <p className="text-sm font-bold text-slate-600">مرحباً {dbUser.name}، أدخل كلمة السر</p>
                                <input type="password" className="w-full p-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-emerald-500 outline-none text-center text-2xl tracking-widest font-bold" value={password} onChange={(e) => setPassword(e.target.value)}/>
                                <button onClick={handlePasswordLogin} className="w-full py-4 bg-emerald-500 text-white rounded-2xl font-black text-lg shadow-lg">دخول</button>
                                <button onClick={forgotPassword} className="text-slate-400 text-xs font-bold hover:text-emerald-500 underline">نسيت كلمة السر؟</button>
                            </div>
                        )}

                        {step === 'setup-password' && (
                            <div className="space-y-5">
                                <p className="text-sm font-bold text-emerald-600">هذا دخولك الأول! أنشئ كلمة سر للوحة</p>
                                <input type="password" className="w-full p-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-emerald-500 outline-none text-center font-bold" placeholder="كلمة السر الجديدة" value={password} onChange={(e) => setPassword(e.target.value)}/>
                                <button onClick={handleSetupPassword} className="w-full py-4 bg-emerald-500 text-white rounded-2xl font-black text-lg shadow-lg">تفعيل الحساب</button>
                            </div>
                        )}
                    </div>
                </div>
            );

            // --- Dashboard Main UI ---
            const isAdmin = dbUser.role === 'admin';
            const marketers = allUsers.filter(u => u.role === 'marketer');
            const myReferrals = allUsers.filter(u => u.referredBy === dbUser.uid);

            return (
                <div className="min-h-screen pb-20">
                    {/* Top Navbar */}
                    <nav className="bg-slate-900 text-white p-5 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-500 w-10 h-10 rounded-xl flex items-center justify-center"><i className="fas fa-chart-pie"></i></div>
                                <span className="font-black text-lg tracking-tight">DATA BRIDGE HUB</span>
                            </div>
                            <div className="flex items-center gap-5">
                                <div className="text-left leading-tight hidden md:block">
                                    <p className="text-[10px] font-bold opacity-50 uppercase">Account</p>
                                    <p className="text-sm font-black">{dbUser.name}</p>
                                </div>
                                <button onClick={() => window.location.reload()} className="w-10 h-10 rounded-full hover:bg-white/10 text-red-400 transition-all border border-white/10"><i className="fas fa-power-off"></i></button>
                            </div>
                        </div>
                    </nav>

                    <div className="max-w-7xl mx-auto p-4 md:p-10">
                        {/* Summary Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                            <div className="bg-white p-8 rounded-[35px] border border-slate-100 shadow-sm relative overflow-hidden group">
                                <div className="absolute top-0 right-0 w-2 h-full bg-emerald-500"></div>
                                <p className="text-xs font-black text-slate-400 uppercase mb-4">{isAdmin ? 'المسوقين' : 'عملائي'}</p>
                                <h3 className="text-5xl font-black text-slate-800">{isAdmin ? marketers.length : myReferrals.length}</h3>
                            </div>
                            <div className="bg-white p-8 rounded-[35px] border border-slate-100 shadow-sm relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-2 h-full bg-blue-500"></div>
                                <p className="text-xs font-black text-slate-400 uppercase mb-4">{isAdmin ? 'إجمالي الخدمات' : 'أرباحي'}</p>
                                <div className="flex items-baseline gap-2">
                                    <h3 className="text-5xl font-black text-slate-800">{isAdmin ? services.length : (dbUser.commissionBalance || 0).toFixed(0)}</h3>
                                    {!isAdmin && <span className="font-black text-slate-400">ج.م</span>}
                                </div>
                                {!isAdmin && (dbUser.commissionBalance || 0) >= 100 && (
                                    <button onClick={() => setShowWithdrawModal(true)} className="mt-5 w-full py-3 bg-emerald-500 text-white rounded-2xl font-black text-sm hover:bg-emerald-600 transition-all shadow-lg shadow-emerald-100">سحب الأرباح</button>
                                )}
                            </div>
                            <div className="bg-white p-8 rounded-[35px] border border-slate-100 shadow-sm relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-2 h-full bg-purple-500"></div>
                                <p className="text-xs font-black text-slate-400 uppercase mb-4">خدمات مكتملة</p>
                                <h3 className="text-5xl font-black text-slate-800">{services.filter(s => s.status === 'تم التنفيذ').length}</h3>
                            </div>
                        </div>

                        {isAdmin ? (
                            /* ADMIN VIEW */
                            <div className="space-y-10">
                                {withdrawals.filter(w => w.status === 'معلق').length > 0 && (
                                    <div className="bg-amber-50 border-2 border-amber-200 p-8 rounded-[40px]">
                                        <h3 className="font-black text-amber-800 mb-6 flex items-center gap-3"><i className="fas fa-hand-holding-dollar"></i> طلبات سحب قيد الانتظار:</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {withdrawals.filter(w => w.status === 'معلق').map(w => (
                                                <div key={w.id} className="bg-white p-5 rounded-3xl flex justify-between items-center shadow-sm border border-amber-100">
                                                    <div>
                                                        <p className="font-black text-slate-800">{w.marketerName}</p>
                                                        <p className="text-xs font-bold text-slate-500 mt-1">{w.amount} ج.م | {w.number} ({w.method})</p>
                                                    </div>
                                                    <button onClick={async () => await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('withdrawals').doc(w.id).update({ status: 'تم الدفع' })} className="bg-emerald-500 text-white px-5 py-2 rounded-xl text-xs font-black">تأكيد الدفع</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-8 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
                                        <h2 className="font-black text-2xl text-slate-800">قائمة المسوقين</h2>
                                    </div>
                                    <div className="divide-y divide-slate-50">
                                        {marketers.map(m => (
                                            <div key={m.id} className="p-8 hover:bg-slate-50 transition-all group">
                                                <div className="flex flex-wrap justify-between items-center gap-6">
                                                    <div className="flex items-center gap-5">
                                                        <div className="w-16 h-16 bg-slate-100 rounded-[22px] flex items-center justify-center font-black text-2xl text-slate-400 group-hover:bg-emerald-500 group-hover:text-white transition-all uppercase">{m.name.charAt(0)}</div>
                                                        <div>
                                                            <h4 className="font-black text-xl text-slate-800">{m.name}</h4>
                                                            <p className="text-sm text-slate-400 font-bold">{m.phone} | {m.email}</p>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-8">
                                                        <div className="text-center">
                                                            <p className="text-[10px] font-black text-slate-300 uppercase mb-1">العملاء</p>
                                                            <button onClick={() => { setSelectedMarketer(m); setSelectedReferral(null); }} className="bg-slate-900 text-white px-5 py-2 rounded-full text-xs font-black hover:bg-emerald-500 transition-all">
                                                                {allUsers.filter(u => u.referredBy === m.uid).length} عملاء
                                                            </button>
                                                        </div>
                                                        <div className="text-center">
                                                            <p className="text-[10px] font-black text-slate-300 uppercase mb-1">العمولة</p>
                                                            <p className="font-black text-xl text-slate-800">{m.commissionBalance || 0} ج.م</p>
                                                        </div>
                                                    </div>
                                                </div>

                                                {selectedMarketer?.uid === m.uid && (
                                                    <div className="mt-10 bg-slate-100/50 p-8 rounded-[35px] border border-slate-200 animate-in fade-in duration-300">
                                                        <h5 className="font-black text-slate-500 mb-6 flex justify-between items-center">
                                                            <span>شجرة عملاء المسوق: {m.name}</span>
                                                            <button onClick={() => setSelectedMarketer(null)} className="text-red-400 hover:scale-110 transition-all"><i className="fas fa-times-circle text-2xl"></i></button>
                                                        </h5>
                                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                                            {allUsers.filter(u => u.referredBy === m.uid).map(ref => (
                                                                <div key={ref.id} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex justify-between items-center">
                                                                    <div className="flex-1">
                                                                        <p className="font-black text-lg text-slate-800">{ref.name}</p>
                                                                        <p className="text-xs text-slate-400 font-bold">{ref.phone}</p>
                                                                        <div className="mt-4 flex flex-wrap gap-2">
                                                                            {services.filter(s => s.userId === ref.uid).map(s => (
                                                                                <span key={s.id} className={`text-[10px] px-3 py-1 rounded-lg font-black ${s.status === 'تم التنفيذ' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}`}>
                                                                                    {s.name} ({s.price}ج)
                                                                                </span>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                    <button onClick={() => { setSelectedReferral(ref); setShowServiceModal(true); }} className="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center hover:bg-emerald-500 transition-all shadow-lg"><i className="fas fa-plus"></i></button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* MARKETER VIEW */
                            <div className="bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden">
                                <div className="p-8 border-b border-slate-50 bg-slate-50/50">
                                    <h2 className="font-black text-2xl text-slate-800">سجل عملائك</h2>
                                </div>
                                <div className="divide-y divide-slate-50">
                                    {myReferrals.length === 0 ? (
                                        <div className="p-24 text-center">
                                            <i className="fas fa-users-slash text-5xl text-slate-200 mb-5 block"></i>
                                            <p className="text-slate-400 font-bold">لا يوجد عملاء مسجلين عبر رابطك حالياً.</p>
                                        </div>
                                    ) : (
                                        myReferrals.map(ref => (
                                            <div key={ref.id} className="p-8 flex justify-between items-center">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-12 h-12 bg-emerald-50 text-emerald-500 rounded-2xl flex items-center justify-center font-black text-xl">{ref.name.charAt(0)}</div>
                                                    <div>
                                                        <h4 className="font-black text-lg text-slate-800">{ref.name}</h4>
                                                        <p className="text-xs text-slate-400 font-bold">عضو منذ {new Date(ref.joinDate?.seconds * 1000).toLocaleDateString('ar-EG')}</p>
                                                    </div>
                                                </div>
                                                <div className="text-left">
                                                    {services.filter(s => s.userId === ref.uid).length > 0 ? (
                                                        services.filter(s => s.userId === ref.uid).map(s => (
                                                            <span key={s.id} className={`text-[10px] px-3 py-1 rounded-full font-black block mb-1 ${s.status === 'تم التنفيذ' ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-500'}`}>
                                                                {s.name}: {s.status}
                                                            </span>
                                                        ))
                                                    ) : (
                                                        <span className="text-[10px] font-black text-slate-300">لم يطلب خدمات بعد</span>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MODALS */}
                    {showServiceModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[40px] p-10 w-full max-w-md shadow-2xl animate-in zoom-in-95 duration-300">
                                <h3 className="text-2xl font-black mb-2">تسجيل عملية بيع</h3>
                                <p className="text-slate-400 font-bold mb-8 italic">للعميل: {selectedReferral?.name}</p>
                                <div className="space-y-5 text-right">
                                    <label className="text-xs font-black text-slate-400 px-2 uppercase tracking-tighter">اسم الخدمة البرمجية</label>
                                    <input className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold focus:bg-white border-2 border-transparent focus:border-emerald-500 transition-all" placeholder="مثال: متجر ملكي" value={serviceForm.name} onChange={e => setServiceForm({...serviceForm, name: e.target.value})}/>
                                    <label className="text-xs font-black text-slate-400 px-2 uppercase tracking-tighter">السعر (ج.م)</label>
                                    <input className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold focus:bg-white border-2 border-transparent focus:border-emerald-500 transition-all" type="number" placeholder="5000" value={serviceForm.price} onChange={e => setServiceForm({...serviceForm, price: e.target.value})}/>
                                    <label className="text-xs font-black text-slate-400 px-2 uppercase tracking-tighter">حالة التنفيذ</label>
                                    <select className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold focus:bg-white border-2 border-transparent focus:border-emerald-500 transition-all" value={serviceForm.status} onChange={e => setServiceForm({...serviceForm, status: e.target.value})}>
                                        <option>جارية</option>
                                        <option>تم التنفيذ</option>
                                        <option>تم الرفض</option>
                                    </select>
                                    <div className="grid grid-cols-2 gap-4 mt-8">
                                        <button onClick={addService} className="bg-emerald-500 text-white py-4 rounded-2xl font-black shadow-lg shadow-emerald-100">حفظ وتعميد</button>
                                        <button onClick={() => setShowServiceModal(false)} className="bg-slate-100 text-slate-500 py-4 rounded-2xl font-black">إغلاق</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showWithdrawModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[40px] p-10 w-full max-w-md shadow-2xl">
                                <h3 className="text-2xl font-black mb-2">سحب العمولات</h3>
                                <p className="text-slate-400 font-bold mb-8">رصيدك الحالي: {dbUser.commissionBalance} ج.م</p>
                                <div className="space-y-5 text-right">
                                    <label className="text-xs font-black text-slate-400 px-2 uppercase">المبلغ المراد سحبه</label>
                                    <input className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold" type="number" placeholder="100" value={withdrawForm.amount} onChange={e => setWithdrawForm({...withdrawForm, amount: e.target.value})}/>
                                    <label className="text-xs font-black text-slate-400 px-2 uppercase">رقم التحويل</label>
                                    <input className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold" placeholder="01xxxxxxxxx" value={withdrawForm.number} onChange={e => setWithdrawForm({...withdrawForm, number: e.target.value})}/>
                                    <label className="text-xs font-black text-slate-400 px-2 uppercase">طريقة الدفع</label>
                                    <select className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold" value={withdrawForm.method} onChange={e => setWithdrawForm({...withdrawForm, method: e.target.value})}>
                                        <option value="Vodafone Cash">فودافون كاش</option>
                                        <option value="InstaPay">انستا باي</option>
                                    </select>
                                    <div className="grid grid-cols-2 gap-4 mt-8">
                                        <button onClick={submitWithdraw} className="bg-emerald-500 text-white py-4 rounded-2xl font-black shadow-lg shadow-emerald-100">إرسال الطلب</button>
                                        <button onClick={() => setShowWithdrawModal(false)} className="bg-slate-100 text-slate-500 py-4 rounded-2xl font-black">إلغاء</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
