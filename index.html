<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز عمليات داتا بريدج | Data Bridge Ops Pro</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Scripts: React, Babel, Tailwind, Lucide -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDKs (Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; scroll-behavior: smooth; }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #2ecc71; border-radius: 10px; }
        .glass-nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); }
        .stat-card-gradient { background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyCic2l0BP5h6sEiPxPkVO7A6RaIVr77BIA",
            authDomain: "data-bridge-dd630.firebaseapp.com",
            projectId: "data-bridge-dd630",
            storageBucket: "data-bridge-dd630.firebasestorage.app",
            messagingSenderId: "314199405184",
            appId: "1:314199405184:web:8a7bb62163c5e0e7eaec65",
            measurementId: "G-QYKYHC88WS"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "data-bridge";

        function App() {
            const [dbUser, setDbUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [step, setStep] = useState('auth-email'); 
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            
            // Data States
            const [allUsers, setAllUsers] = useState([]);
            const [services, setServices] = useState([]);
            const [withdrawals, setWithdrawals] = useState([]);
            const [selectedMarketer, setSelectedMarketer] = useState(null);
            const [selectedReferral, setSelectedReferral] = useState(null);
            const [showServiceModal, setShowServiceModal] = useState(false);
            const [showWithdrawModal, setShowWithdrawModal] = useState(false);

            // Forms
            const [serviceForm, setServiceForm] = useState({ name: '', price: '', status: 'جارية' });
            const [withdrawForm, setWithdrawForm] = useState({ amount: '', number: '', method: 'Vodafone Cash' });

            // 1. بروتوكول حفظ الجلسة واستعادة الدخول (Session Persistence)
            useEffect(() => {
                const init = async () => {
                    try {
                        await auth.signInAnonymously();
                        
                        // محاولة استعادة الجلسة من LocalStorage
                        const savedSession = localStorage.getItem('db_ops_session');
                        if (savedSession) {
                            const parsed = JSON.parse(savedSession);
                            setDbUser(parsed);
                            setStep('dashboard');
                        }
                        
                        setLoading(false);
                    } catch (e) {
                        setError("فشل الاتصال بالخادم الرئيسي.");
                        setLoading(false);
                    }
                };
                init();
            }, []);

            // 2. مزامنة البيانات اللحظية
            useEffect(() => {
                if (step === 'dashboard' && dbUser) {
                    const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                    
                    const unsubUsers = baseRef.collection('users').onSnapshot(snap => {
                        setAllUsers(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                    const unsubServices = baseRef.collection('services').onSnapshot(snap => {
                        const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        // ترتيب حسب التاريخ الأحدث
                        setServices(data.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                    });

                    const unsubWithdraw = baseRef.collection('withdrawals').onSnapshot(snap => {
                        setWithdrawals(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                    const unsubMe = baseRef.collection('users').doc(dbUser.uid).onSnapshot(doc => {
                        if(doc.exists) {
                            const updatedMe = { ...doc.data(), uid: doc.id };
                            setDbUser(updatedMe);
                            localStorage.setItem('db_ops_session', JSON.stringify(updatedMe)); // تحديث التخزين
                        }
                    });

                    return () => { unsubUsers(); unsubServices(); unsubWithdraw(); unsubMe(); };
                }
            }, [step]);

            // --- Business Logic ---
            const checkEmail = async () => {
                if (!email) return;
                setError('');
                setLoading(true);
                try {
                    const snap = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users')
                        .where('email', '==', email.trim().toLowerCase()).get();
                    
                    if (snap.empty) {
                        setError('الإيميل غير مسجل كإدارة أو مسوق.');
                    } else {
                        const doc = snap.docs[0];
                        const data = doc.data();
                        const role = data.role ? data.role.toLowerCase() : 'user';
                        if (role !== 'admin' && role !== 'marketer') {
                            setError('لا تملك صلاحية دخول غرفة العمليات.');
                        } else {
                            const userData = { ...data, uid: doc.id };
                            setDbUser(userData);
                            setStep(data.dashboardPassword ? 'auth-password' : 'setup-password');
                        }
                    }
                } catch (e) { setError('خطأ في جلب البيانات.'); }
                setLoading(false);
            };

            const handlePasswordLogin = () => {
                if (password === dbUser.dashboardPassword) {
                    localStorage.setItem('db_ops_session', JSON.stringify(dbUser)); // حفظ الجلسة
                    setStep('dashboard');
                } else setError('كلمة المرور غير صحيحة.');
            };

            const handleLogout = () => {
                if(confirm("هل تريد الخروج وإغلاق الجلسة؟")) {
                    localStorage.removeItem('db_ops_session');
                    window.location.reload();
                }
            };

            const addService = async () => {
                const serviceData = { 
                    ...serviceForm, 
                    userId: selectedReferral.uid, 
                    userName: selectedReferral.name, 
                    marketerId: selectedMarketer.uid, 
                    price: parseFloat(serviceForm.price), 
                    timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                };
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('services').add(serviceData);
                
                if (serviceForm.status === 'تم التنفيذ') {
                    const commission = parseFloat(serviceForm.price) * 0.1;
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(selectedMarketer.uid).update({ 
                        commissionBalance: firebase.firestore.FieldValue.increment(commission) 
                    });
                }
                setShowServiceModal(false);
                setServiceForm({ name: '', price: '', status: 'جارية' });
            };

            const confirmWithdrawal = async (id) => {
                if(confirm("تأكيد دفع هذا المبلغ للمسوق؟")) {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('withdrawals').doc(id).update({
                        status: 'تم الدفع',
                        paidAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            };

            // --- Calculations for Stats ---
            const stats = useMemo(() => {
                const totalRevenue = services.filter(s => s.status === 'تم التنفيذ').reduce((acc, curr) => acc + (curr.price || 0), 0);
                const pendingWithdraws = withdrawals.filter(w => w.status === 'معلق').length;
                const totalUsers = allUsers.length;
                const activeMarketers = allUsers.filter(u => u.role?.toLowerCase() === 'marketer').length;
                return { totalRevenue, pendingWithdraws, totalUsers, activeMarketers };
            }, [services, withdrawals, allUsers]);

            // --- UI Renders ---
            if (loading) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 text-emerald-500">
                    <div className="text-center">
                        <div className="animate-spin-custom rounded-full h-16 w-16 border-t-4 border-emerald-500 mb-4 mx-auto"></div>
                        <p className="font-black text-white tracking-widest uppercase">Initializing Ops Center...</p>
                    </div>
                </div>
            );

            if (step !== 'dashboard') return (
                <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4">
                    <div className="bg-white p-10 rounded-[45px] shadow-2xl w-full max-w-md border-t-[10px] border-emerald-500 text-center relative overflow-hidden">
                        <div className="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-inner">
                            <i className="fas fa-fingerprint text-3xl"></i>
                        </div>
                        <h1 className="text-2xl font-black text-slate-800">غرفة العمليات</h1>
                        <p className="text-slate-400 mt-1 mb-8 font-bold">Data Bridge Security Layer</p>

                        {error && <div className="bg-red-50 text-red-600 p-4 rounded-2xl text-sm mb-6 font-bold">{error}</div>}
                        
                        {step === 'auth-email' && (
                            <div className="space-y-4">
                                <input type="email" className="w-full p-5 rounded-2xl bg-slate-100 border-2 border-transparent focus:border-emerald-500 outline-none text-center font-bold transition-all" placeholder="الإيميل المعتمد" value={email} onChange={(e) => setEmail(e.target.value)}/>
                                <button onClick={checkEmail} className="w-full py-4 bg-emerald-500 text-white rounded-2xl font-black text-lg shadow-lg shadow-emerald-200 active:scale-95 transition-all">تحقق من الصلاحية</button>
                            </div>
                        )}

                        {step === 'auth-password' && (
                            <div className="space-y-4">
                                <p className="text-sm font-bold text-slate-600">أهلاً {dbUser.name}، أدخل مفتاح العبور</p>
                                <input type="password" className="w-full p-5 rounded-2xl bg-slate-100 border-2 border-transparent focus:border-emerald-500 outline-none text-center text-3xl tracking-[15px] font-black transition-all" value={password} onChange={(e) => setPassword(e.target.value)}/>
                                <button onClick={handlePasswordLogin} className="w-full py-4 bg-emerald-500 text-white rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">دخول النظام</button>
                            </div>
                        )}

                        {step === 'setup-password' && (
                            <div className="space-y-4">
                                <p className="text-sm font-bold text-emerald-600">إنشاء كلمة سر للوحة التحكم</p>
                                <input type="password" className="w-full p-5 rounded-2xl bg-slate-100 border-2 border-transparent focus:border-emerald-500 outline-none text-center font-bold" placeholder="كلمة السر الجديدة" value={password} onChange={(e) => setPassword(e.target.value)}/>
                                <button onClick={handleSetupPassword} className="w-full py-4 bg-emerald-500 text-white rounded-2xl font-black text-lg">تفعيل الجلسة</button>
                            </div>
                        )}
                        <p className="text-[10px] text-slate-300 mt-8 font-black uppercase tracking-widest">Encrypted Session System</p>
                    </div>
                </div>
            );

            // --- Dashboard Body ---
            const isAdmin = dbUser.role?.toLowerCase() === 'admin';

            return (
                <div className="min-h-screen">
                    {/* Professional Navbar */}
                    <nav className="glass-nav text-white p-4 sticky top-0 z-50 shadow-lg border-b border-white/5">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="bg-emerald-500 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/30"><i className="fas fa-rocket"></i></div>
                                <div className="leading-tight">
                                    <span className="font-black text-lg block tracking-tighter uppercase">DATA BRIDGE</span>
                                    <span className="text-[9px] font-black text-emerald-400 uppercase">Operating System 2.0</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-6">
                                <div className="text-left hidden md:block border-l border-white/10 pl-6">
                                    <p className="text-[10px] font-bold opacity-50 uppercase tracking-widest">Operator</p>
                                    <p className="text-sm font-black">{dbUser.name}</p>
                                </div>
                                <button onClick={handleLogout} className="w-10 h-10 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all border border-red-500/20"><i className="fas fa-power-off"></i></button>
                            </div>
                        </div>
                    </nav>

                    <div className="max-w-7xl mx-auto p-4 md:p-8">
                        
                        {isAdmin ? (
                            /* --- ADMIN PRO VIEW --- */
                            <div className="space-y-8">
                                {/* 1. Stats Row */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    <div className="stat-card-gradient p-8 rounded-[35px] border border-white shadow-sm">
                                        <p className="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest">إجمالي المبيعات</p>
                                        <h3 className="text-4xl font-black text-slate-800">{stats.totalRevenue.toLocaleString()} <span className="text-sm text-slate-300">ج.م</span></h3>
                                    </div>
                                    <div className="stat-card-gradient p-8 rounded-[35px] border border-white shadow-sm">
                                        <p className="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest">قاعدة العملاء</p>
                                        <h3 className="text-4xl font-black text-slate-800">{stats.totalUsers} <span className="text-sm text-slate-300">عضو</span></h3>
                                    </div>
                                    <div className="stat-card-gradient p-8 rounded-[35px] border border-white shadow-sm">
                                        <p className="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest">جيش المسوقين</p>
                                        <h3 className="text-4xl font-black text-emerald-500">{stats.activeMarketers} <span className="text-sm text-emerald-200">مسوق</span></h3>
                                    </div>
                                    <div className="stat-card-gradient p-8 rounded-[35px] border border-white shadow-sm">
                                        <p className="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest">طلبات سحب</p>
                                        <h3 className={`text-4xl font-black ${stats.pendingWithdraws > 0 ? 'text-red-500 animate-pulse' : 'text-slate-800'}`}>{stats.pendingWithdraws}</h3>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    {/* 2. Management List (Left 2 Columns) */}
                                    <div className="lg:col-span-2 space-y-8">
                                        {/* Pending Withdrawals Detailed */}
                                        {withdrawals.filter(w => w.status === 'معلق').length > 0 && (
                                            <div className="bg-amber-50 border-2 border-amber-200 p-8 rounded-[40px] shadow-sm">
                                                <h3 className="font-black text-amber-900 mb-6 flex items-center gap-3"><i className="fas fa-hourglass-half"></i> طلبات سحب تحتاج موافقة:</h3>
                                                <div className="space-y-3">
                                                    {withdrawals.filter(w => w.status === 'معلق').map(w => (
                                                        <div key={w.id} className="bg-white p-5 rounded-3xl flex justify-between items-center border border-amber-100">
                                                            <div>
                                                                <p className="font-black text-slate-800 text-lg">{w.marketerName}</p>
                                                                <p className="text-xs font-bold text-slate-500 mt-1">{w.amount} ج.م | {w.method}: {w.number}</p>
                                                            </div>
                                                            <button onClick={() => confirmWithdrawal(w.id)} className="bg-emerald-500 text-white px-6 py-3 rounded-2xl font-black text-sm hover:bg-emerald-600 shadow-lg shadow-emerald-100">تأكيد الدفع</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* Marketers Directory */}
                                        <div className="bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden">
                                            <div className="p-8 border-b bg-slate-50/50"><h2 className="font-black text-xl">إدارة المسوقين النشطين</h2></div>
                                            <div className="divide-y divide-slate-50">
                                                {marketers.map(m => (
                                                    <div key={m.id} className="p-8 hover:bg-slate-50 transition-all group">
                                                        <div className="flex flex-wrap justify-between items-center gap-6">
                                                            <div className="flex items-center gap-4">
                                                                <div className="w-14 h-14 bg-slate-100 rounded-2xl flex items-center justify-center font-black text-slate-400 group-hover:bg-emerald-500 group-hover:text-white transition-all uppercase">{m.name.charAt(0)}</div>
                                                                <div>
                                                                    <h4 className="font-black text-lg text-slate-800">{m.name}</h4>
                                                                    <p className="text-xs font-bold text-slate-400">{m.phone} | {m.email}</p>
                                                                </div>
                                                            </div>
                                                            <div className="flex items-center gap-6">
                                                                <button onClick={() => { setSelectedMarketer(m); setSelectedReferral(null); }} className="bg-slate-900 text-white px-6 py-2 rounded-full text-xs font-black hover:bg-emerald-500 transition-all">
                                                                    {allUsers.filter(u => u.referredBy === m.uid).length} عملاء
                                                                </button>
                                                                <p className="font-black text-xl text-slate-800">{m.commissionBalance || 0}ج</p>
                                                            </div>
                                                        </div>
                                                        {selectedMarketer?.uid === m.uid && (
                                                            <div className="mt-8 bg-slate-100 p-8 rounded-[35px] border border-slate-200 animate-in fade-in zoom-in-95">
                                                                <div className="flex justify-between items-center mb-6">
                                                                    <h5 className="font-black text-slate-500">شجرة عملاء: {m.name}</h5>
                                                                    <button onClick={() => setSelectedMarketer(null)} className="text-red-400 hover:rotate-90 transition-all"><i className="fas fa-times-circle text-2xl"></i></button>
                                                                </div>
                                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                                    {allUsers.filter(u => u.referredBy === m.uid).map(ref => (
                                                                        <div key={ref.id} className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex justify-between items-center">
                                                                            <div className="text-right">
                                                                                <p className="font-black text-slate-800">{ref.name}</p>
                                                                                <p className="text-xs text-slate-400 font-bold">{ref.phone}</p>
                                                                            </div>
                                                                            <button onClick={() => { setSelectedReferral(ref); setShowServiceModal(true); }} className="w-10 h-10 bg-emerald-500 text-white rounded-xl shadow-lg hover:rotate-90 transition-all"><i className="fas fa-plus"></i></button>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* 3. Recent Activity (Right Column) */}
                                    <div className="space-y-8">
                                        <div className="bg-slate-900 text-white rounded-[40px] p-8 shadow-xl">
                                            <h3 className="font-black text-lg mb-6 border-b border-white/10 pb-4">آخر العمليات الناجحة</h3>
                                            <div className="space-y-6">
                                                {services.slice(0, 8).map(s => (
                                                    <div key={s.id} className="flex gap-4 items-start">
                                                        <div className={`w-2 h-2 rounded-full mt-2 shrink-0 ${s.status === 'تم التنفيذ' ? 'bg-emerald-500 shadow-[0_0_10px_#2ecc71]' : 'bg-amber-500'}`}></div>
                                                        <div>
                                                            <p className="text-xs font-black">{s.userName}</p>
                                                            <p className="text-[10px] opacity-50 font-bold">{s.name} - {s.price}ج</p>
                                                            <p className="text-[8px] opacity-30 mt-1 uppercase font-black">{new Date(s.timestamp?.seconds * 1000).toLocaleString('ar-EG')}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                                {services.length === 0 && <p className="text-center opacity-30 py-10">لا توجد عمليات مسجلة</p>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* --- MARKETER VIEW --- */
                            <div className="space-y-8">
                                <div className="bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-8 border-b bg-slate-50/50 flex justify-between items-center">
                                        <h2 className="font-black text-2xl">عملائي المسجلين برابطي</h2>
                                        <button className="bg-emerald-500 text-white px-6 py-2 rounded-full text-xs font-black" onClick={() => {
                                            const link = `${window.location.origin}/?ref=${dbUser.uid}`;
                                            navigator.clipboard.writeText(link);
                                            alert("تم نسخ رابط الإحالة الخاص بك!");
                                        }}>نسخ رابط الإحالة</button>
                                    </div>
                                    <div className="divide-y divide-slate-50">
                                        {myReferrals.length === 0 ? (
                                            <div className="p-32 text-center text-slate-300">
                                                <i className="fas fa-users-slash text-6xl mb-6"></i>
                                                <p className="font-black text-xl">لا يوجد عملاء بعد. ابدأ بنشر رابطك!</p>
                                            </div>
                                        ) : myReferrals.map(ref => (
                                            <div key={ref.id} className="p-8 flex justify-between items-center hover:bg-slate-50 transition-all">
                                                <div className="flex items-center gap-5">
                                                    <div className="w-14 h-14 bg-emerald-50 text-emerald-500 rounded-2xl flex items-center justify-center font-black text-xl">{ref.name.charAt(0)}</div>
                                                    <div className="text-right">
                                                        <h4 className="font-black text-lg">{ref.name}</h4>
                                                        <div className="flex items-center gap-2 text-xs text-slate-400 font-bold mt-1">
                                                            <span>{ref.phone}</span>
                                                            <button onClick={() => window.open(`https://wa.me/2${ref.phone}`, '_blank')} className="text-emerald-500"><i className="fab fa-whatsapp text-lg"></i></button>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="text-left space-y-1">
                                                    {services.filter(s => s.userId === ref.uid).map(s => (
                                                        <span key={s.id} className={`text-[10px] px-3 py-1 rounded-full font-black block border ${s.status === 'تم التنفيذ' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-50 text-slate-500 border-slate-100'}`}>
                                                            {s.name}: {s.status}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* --- MODALS --- */}
                    {showServiceModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[45px] p-10 w-full max-w-md shadow-2xl animate-in zoom-in-95 duration-200">
                                <h3 className="text-2xl font-black mb-2">تعميد خدمة برمجية</h3>
                                <p className="text-slate-400 font-bold mb-8 italic">للعميل: {selectedReferral?.name}</p>
                                <div className="space-y-4">
                                    <input className="w-full p-5 bg-slate-100 rounded-2xl outline-none font-bold border-2 border-transparent focus:border-emerald-500 transition-all text-right" placeholder="اسم الخدمة (مثلاً: متجر ملكي)" value={serviceForm.name} onChange={e => setServiceForm({...serviceForm, name: e.target.value})}/>
                                    <input className="w-full p-5 bg-slate-100 rounded-2xl outline-none font-bold border-2 border-transparent focus:border-emerald-500 transition-all text-right" type="number" placeholder="السعر الكلي (ج.م)" value={serviceForm.price} onChange={e => setServiceForm({...serviceForm, price: e.target.value})}/>
                                    <select className="w-full p-5 bg-slate-100 rounded-2xl outline-none font-bold border-2 border-transparent focus:border-emerald-500 transition-all text-right" value={serviceForm.status} onChange={e => setServiceForm({...serviceForm, status: e.target.value})}>
                                        <option>جارية</option><option>تم التنفيذ</option><option>تم الرفض</option>
                                    </select>
                                    <div className="grid grid-cols-2 gap-4 mt-8">
                                        <button onClick={addService} className="bg-emerald-500 text-white py-5 rounded-2xl font-black shadow-lg shadow-emerald-100">حفظ العملية</button>
                                        <button onClick={() => setShowServiceModal(false)} className="bg-slate-200 text-slate-600 py-5 rounded-2xl font-black">إغلاق</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showWithdrawModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[45px] p-10 w-full max-w-md shadow-2xl">
                                <h3 className="text-2xl font-black mb-2">سحب العمولات 💰</h3>
                                <p className="text-slate-400 font-bold mb-8 italic text-sm">رصيدك القابل للسحب حالياً: {dbUser.commissionBalance} ج.م</p>
                                <div className="space-y-4">
                                    <input className="w-full p-5 bg-slate-100 rounded-2xl outline-none font-bold text-center text-xl" type="number" placeholder="المبلغ" value={withdrawForm.amount} onChange={e => setWithdrawForm({...withdrawForm, amount: e.target.value})}/>
                                    <input className="w-full p-5 bg-slate-100 rounded-2xl outline-none font-bold text-center" placeholder="رقم التحويل (01xxxxxxxxx)" value={withdrawForm.number} onChange={e => setWithdrawForm({...withdrawForm, number: e.target.value})}/>
                                    <select className="w-full p-5 bg-slate-100 rounded-2xl outline-none font-bold text-center" value={withdrawForm.method} onChange={e => setWithdrawForm({...withdrawForm, method: e.target.value})}>
                                        <option value="Vodafone Cash">فودافون كاش</option>
                                        <option value="InstaPay">انستا باي</option>
                                    </select>
                                    <div className="grid grid-cols-2 gap-4 mt-8"><button onClick={submitWithdraw} className="bg-emerald-500 text-white py-5 rounded-2xl font-black shadow-lg">إرسال الطلب</button><button onClick={() => setShowWithdrawModal(false)} className="bg-slate-200 text-slate-600 py-5 rounded-2xl font-black">إلغاء</button></div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
