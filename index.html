<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز عمليات داتا بريدج | Data Bridge Ops Pro v5.1</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .modern-card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: transform 0.2s; }
        .modern-card:hover { transform: translateY(-2px); }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .status-badge { font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 8px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCic2l0BP5h6sEiPxPkVO7A6RaIVr77BIA",
            authDomain: "data-bridge-dd630.firebaseapp.com",
            projectId: "data-bridge-dd630",
            storageBucket: "data-bridge-dd630.firebasestorage.app",
            messagingSenderId: "314199405184",
            appId: "1:314199405184:web:8a7bb62163c5e0e7eaec65"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "data-bridge";

        function App() {
            const [dbUser, setDbUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [step, setStep] = useState('auth-email'); 
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            
            const [allUsers, setAllUsers] = useState([]);
            const [services, setServices] = useState([]);
            const [withdrawals, setWithdrawals] = useState([]);
            
            const [showServiceModal, setShowServiceModal] = useState(false);
            const [selectedTargetUser, setSelectedTargetUser] = useState(null);
            const [serviceForm, setServiceForm] = useState({ name: '', price: '', status: 'جارية' });

            useEffect(() => {
                const init = async () => {
                    try {
                        await auth.signInAnonymously();
                        const saved = localStorage.getItem('db_ops_session_v5_1');
                        if (saved) {
                            const parsed = JSON.parse(saved);
                            setDbUser(parsed);
                            setStep('dashboard');
                        }
                        setLoading(false);
                    } catch (e) { setError("فشل الاتصال"); setLoading(false); }
                };
                init();
            }, []);

            // --- نظام جلب البيانات المفلتر (Security Filter) ---
            useEffect(() => {
                if (step === 'dashboard' && dbUser) {
                    const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                    const myId = dbUser.uid || dbUser.id;
                    const isAdmin = dbUser.role?.toLowerCase() === 'admin';

                    // 1. استعلام المستخدمين (فلترة الشجرة)
                    const usersQuery = isAdmin ? 
                        baseRef.collection('users') : 
                        baseRef.collection('users').where('referredBy', '==', myId);

                    const unsubUsers = usersQuery.onSnapshot(snap => {
                        setAllUsers(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                    // 2. استعلام الخدمات (فلترة المبيعات)
                    const servicesQuery = isAdmin ? 
                        baseRef.collection('services') : 
                        baseRef.collection('services').where('marketerId', '==', myId);

                    const unsubServices = servicesQuery.onSnapshot(snap => {
                        setServices(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                    // 3. استعلام السحوبات
                    const unsubWithdraw = baseRef.collection('withdrawals').onSnapshot(snap => {
                        const fetched = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setWithdrawals(isAdmin ? fetched : fetched.filter(w => w.userId === myId));
                    });

                    return () => { unsubUsers(); unsubServices(); unsubWithdraw(); };
                }
            }, [step, dbUser?.id, dbUser?.uid, dbUser?.role]);

            const checkEmail = async () => {
                setError(''); setLoading(true);
                try {
                    const snap = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').where('email', '==', email.trim().toLowerCase()).get();
                    if (snap.empty) {
                        setError('الإيميل غير مسجل');
                    } else {
                        const doc = snap.docs[0];
                        const data = doc.data();
                        setDbUser({ ...data, uid: doc.id });
                        setStep(data.dashboardPassword ? 'auth-password' : 'setup-password');
                    }
                } catch (e) { setError('حدث خطأ'); }
                setLoading(false);
            };

            const handleLogin = () => {
                if (password === dbUser.dashboardPassword) {
                    localStorage.setItem('db_ops_session_v5_1', JSON.stringify(dbUser));
                    setStep('dashboard');
                } else setError('الرمز السري خطأ');
            };

            const handleLogout = () => {
                localStorage.removeItem('db_ops_session_v5_1');
                window.location.reload();
            };

            const stats = useMemo(() => ({
                sales: services.filter(s => s.status === 'تم التنفيذ').reduce((acc, curr) => acc + (curr.price || 0), 0),
                usersCount: allUsers.length,
                pendingWithdraw: withdrawals.filter(w => w.status === 'معلق').length
            }), [services, allUsers, withdrawals]);

            if (loading) return <div className="h-screen flex items-center justify-center bg-white text-emerald-600 font-bold tracking-tighter text-xl italic">DATA BRIDGE OPS IS LOADING...</div>;

            if (step !== 'dashboard') return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
                    <div className="bg-white p-12 rounded-[40px] shadow-2xl w-full max-w-md text-center border border-slate-100">
                        <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-6"><i className="fas fa-fingerprint text-2xl"></i></div>
                        <h1 className="text-2xl font-black mb-6 text-slate-800 tracking-tight">الدخول الآمن</h1>
                        {error && <div className="bg-red-50 text-red-500 p-3 rounded-xl mb-4 text-xs font-bold">{error}</div>}
                        
                        <div className="space-y-4">
                            {step === 'auth-email' ? (
                                <>
                                    <input type="email" className="w-full p-4 rounded-2xl bg-slate-50 text-center outline-none border-2 border-transparent focus:border-emerald-500 transition-all" placeholder="البريد الإلكتروني" value={email} onChange={e => setEmail(e.target.value)} />
                                    <button onClick={checkEmail} className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold shadow-lg shadow-emerald-200 active:scale-95 transition-all">تحقق</button>
                                </>
                            ) : (
                                <>
                                    <input type="password" title="password" className="w-full p-4 rounded-2xl bg-slate-50 text-center text-2xl tracking-[0.5em] outline-none border-2 border-transparent focus:border-emerald-500 transition-all" placeholder="****" value={password} onChange={e => setPassword(e.target.value)} />
                                    <button onClick={handleLogin} className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold shadow-lg shadow-emerald-200 active:scale-95 transition-all">دخول النظام</button>
                                    <button onClick={() => setStep('auth-email')} className="text-xs font-bold text-slate-400 mt-2 hover:underline">العودة للخلف</button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-20">
                    <header className="glass-header sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="bg-emerald-600 p-2 rounded-lg text-white shadow-lg shadow-emerald-500/20"><i className="fas fa-layer-group"></i></div>
                            <h2 className="font-black text-xl tracking-tight text-slate-800">DATA BRIDGE <span className="text-emerald-600">PRO</span></h2>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-left leading-tight hidden sm:block">
                                <p className="text-xs font-black text-slate-800 uppercase">{dbUser.name}</p>
                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">{dbUser.role}</p>
                            </div>
                            <button onClick={handleLogout} className="text-red-500 hover:bg-red-50 w-10 h-10 rounded-full transition-colors"><i className="fas fa-sign-out-alt"></i></button>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto p-6 lg:p-10">
                        {/* Stats Summary */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                            {[
                                { title: dbUser.role === 'admin' ? 'إجمالي مبيعات المنصة' : 'أرباحي المحققة', val: stats.sales + ' ج.م', icon: 'fa-chart-line', color: 'text-emerald-600' },
                                { title: dbUser.role === 'admin' ? 'إجمالي المستخدمين' : 'أعضاء فريقي', val: stats.usersCount, icon: 'fa-user-friends', color: 'text-blue-600' },
                                { title: 'سحوبات معلقة', val: stats.pendingWithdraw, icon: 'fa-clock', color: 'text-amber-500' }
                            ].map((s, i) => (
                                <div key={i} className="modern-card p-8 flex items-center justify-between">
                                    <div>
                                        <p className="text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">{s.title}</p>
                                        <h3 className={`text-2xl font-black ${s.color}`}>{s.val}</h3>
                                    </div>
                                    <div className="w-14 h-14 rounded-2xl bg-slate-50 flex items-center justify-center text-xl text-slate-300"><i className={`fas ${s.icon}`}></i></div>
                                </div>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            {/* Directory Section */}
                            <div className="lg:col-span-8">
                                <div className="modern-card overflow-hidden">
                                    <div className="p-6 border-b bg-slate-50/50 flex justify-between items-center">
                                        <h3 className="font-black text-lg">{dbUser.role === 'admin' ? 'الدليل الشامل' : 'قائمة فريقك'}</h3>
                                        <div className="text-[9px] font-black bg-slate-800 text-white px-3 py-1 rounded-full uppercase tracking-tighter">Secure Data</div>
                                    </div>
                                    <div className="divide-y divide-slate-100 max-h-[600px] overflow-y-auto custom-scroll">
                                        {allUsers.length > 0 ? allUsers.map(u => (
                                            <div key={u.id} className="p-5 flex justify-between items-center hover:bg-slate-50/50 transition-colors">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center font-black uppercase text-lg shadow-sm">{u.name?.charAt(0)}</div>
                                                    <div>
                                                        <h4 className="font-bold text-slate-800 text-sm">{u.name}</h4>
                                                        <p className="text-[10px] text-slate-400 font-bold">{u.email} | {u.phone || '0000'}</p>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => { setSelectedTargetUser(u); setShowServiceModal(true); }} className="bg-slate-900 text-white px-4 py-2 rounded-xl text-[10px] font-black hover:bg-emerald-600 transition-all active:scale-95 shadow-md">إضافة خدمة</button>
                                                    <button onClick={() => window.open(`https://wa.me/2${u.phone}`)} className="bg-emerald-50 text-emerald-600 w-10 h-10 rounded-xl flex items-center justify-center hover:bg-emerald-100 transition-colors"><i className="fab fa-whatsapp"></i></button>
                                                </div>
                                            </div>
                                        )) : (
                                            <div className="p-20 text-center">
                                                <i className="fas fa-folder-open text-slate-200 text-5xl mb-4"></i>
                                                <p className="text-slate-400 font-bold italic">لا يوجد بيانات لعرضها حالياً.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Activity Log Section */}
                            <div className="lg:col-span-4">
                                <div className="modern-card p-6 min-h-full">
                                    <h3 className="font-black text-lg mb-6 border-b pb-4 italic">Recent Logs</h3>
                                    <div className="space-y-6 overflow-y-auto max-h-[550px] custom-scroll pr-2">
                                        {services.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)).map(s => (
                                            <div key={s.id} className="relative pr-4 border-r-2 border-slate-100 pb-2">
                                                <div className={`absolute -right-[7px] top-0 w-3 h-3 rounded-full border-2 border-white shadow-sm ${s.status === 'تم التنفيذ' ? 'bg-emerald-500' : 'bg-amber-400 pulse-pending'}`}></div>
                                                <p className="text-[10px] font-black text-slate-800 leading-none mb-1">{s.userName}</p>
                                                <p className="text-[11px] font-bold text-emerald-600">{s.name} - <span className="text-slate-900">{s.price}ج</span></p>
                                                <div className="flex justify-between items-center mt-2">
                                                    <span className={`status-badge ${s.status === 'تم التنفيذ' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>{s.status}</span>
                                                    <span className="text-[8px] text-slate-300 font-bold">{s.marketerName || 'Direct'}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Modals ... (نفس منطق الـ Modal السابق مع تحسين التصميم) */}
                    {showServiceModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[40px] p-8 w-full max-w-md shadow-2xl border border-white/20">
                                <div className="flex items-center gap-3 mb-6">
                                    <div className="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center"><i className="fas fa-plus"></i></div>
                                    <h3 className="text-xl font-black text-slate-800">تسجيل عملية جديدة</h3>
                                </div>
                                <div className="space-y-4">
                                    <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                        <p className="text-[10px] font-black text-slate-400 uppercase mb-1">العميل الحالي</p>
                                        <p className="font-black text-slate-800">{selectedTargetUser?.name}</p>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 pr-2">اسم الخدمة</label>
                                        <input className="w-full p-4 rounded-2xl bg-slate-50 text-sm font-bold border-2 border-transparent focus:border-emerald-500 outline-none transition-all" placeholder="مثال: بناء موقع" value={serviceForm.name} onChange={e => setServiceForm({...serviceForm, name: e.target.value})} />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 pr-2">المبلغ (ج.م)</label>
                                        <input className="w-full p-4 rounded-2xl bg-slate-50 text-sm font-bold border-2 border-transparent focus:border-emerald-500 outline-none transition-all" type="number" placeholder="000" onChange={e => setServiceForm({...serviceForm, price: e.target.value})} />
                                    </div>
                                    <div className="flex gap-3 mt-6">
                                        <button className="flex-1 py-4 bg-emerald-600 text-white rounded-2xl font-black shadow-lg shadow-emerald-200 active:scale-95 transition-all" onClick={() => setShowServiceModal(false)}>تأكيد وحفظ</button>
                                        <button className="flex-1 py-4 bg-slate-100 text-slate-400 rounded-2xl font-black active:scale-95 transition-all" onClick={() => setShowServiceModal(false)}>إلغاء</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
